[project]
name = "ufence"
version = "0.1.0"
description = "Fencing Exchange Simulation with AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.80.0",
    "crewai-tools>=0.10.0",
    "litellm>=1.40.0,<1.50",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "PyMuPDF>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
agent = "src/agents"
task = "src/tasks"
crew = "src/crew"
tools = "src/tools"